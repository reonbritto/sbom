version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      radix:
        patterns: ["@radix-ui/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      auth:
        patterns: ["better-auth", "@better-auth/*"]
      lint-test:
        patterns:
          - "eslint*"
          - "vitest*"
          - "@testing-library/*"
          - "@vitest/*"
          - "tsx"
      types:
        patterns: ["@types/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
