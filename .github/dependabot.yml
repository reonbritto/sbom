version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      radix:
        patterns: ["@radix-ui/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      auth:
        patterns: ["better-auth", "@better-auth/*"]
      lint-test:
        patterns:
          - "eslint*"
          - "vitest*"
          - "@testing-library/*"
          - "@vitest/*"
          - "tsx"
      types:
        patterns: ["@types/*"]
    ignore:
      # Hold majors that require coordinated migration work.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The following are pending review — uncomment to silence:
      # - dependency-name: "p-limit"
      #   update-types: ["version-update:semver-major"]
      # - dependency-name: "lucide-react"
      #   update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to Node 20 in CI matrix; only allow within-major Node bumps.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
