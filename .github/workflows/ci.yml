name: CI
#interview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "20"
  IMAGE_NAME: sbom-vuln-analyzer

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npx prisma generate
      - name: ESLint
        run: npx eslint . --max-warnings=0

  # ──────────────────────────────────────────────
  # TypeCheck + Build
  # ──────────────────────────────────────────────
  typecheck-build:
    name: TypeCheck & Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npx prisma generate
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: dummy-ci-secret-not-a-real-key-32bytes
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          REDIS_URL: redis://localhost:6379

  # ──────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────
  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npx prisma generate
      - name: Vitest
        run: npx vitest run --reporter=default

  # ──────────────────────────────────────────────
  # SAST (CodeQL)
  # ──────────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ──────────────────────────────────────────────
  # SCA (Snyk) — uses SNYK_TOKEN
  # ──────────────────────────────────────────────
  sca:
    name: SCA (Snyk)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Snyk test (severity threshold = medium)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium
        continue-on-error: true

      - name: Snyk test → SARIF
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
        continue-on-error: true

      - name: Upload Snyk SARIF
        if: ${{ always() && hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk-node

  # ──────────────────────────────────────────────
  # Secrets (gitleaks)
  # ──────────────────────────────────────────────
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Dependency audit (cheap belt-and-braces alongside Snyk)
  # ──────────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: npm audit (high+)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  # ──────────────────────────────────────────────
  # SBOM (CycloneDX) — application source SBOM
  # ──────────────────────────────────────────────
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-file sbom.json \
            --output-format JSON \
            --omit dev \
            --ignore-npm-errors
      - name: Generate CycloneDX SBOM (XML)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-file sbom.xml \
            --output-format XML \
            --omit dev \
            --ignore-npm-errors
      - name: Summary
        run: |
          node -e "
            const sbom = JSON.parse(require('fs').readFileSync('sbom.json', 'utf8'));
            const c = sbom.components || [];
            console.log('Total components:', c.length);
            c.slice(0, 30).forEach(x => console.log('  -', x.name + '@' + (x.version || '?')));
            if (c.length > 30) console.log('  ... and', c.length - 30, 'more');
          "
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml

  # ──────────────────────────────────────────────
  # Trivy filesystem scan (catches bad deps before image build)
  # ──────────────────────────────────────────────
  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Trivy fs scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          severity: CRITICAL,HIGH
          output: trivy-fs.sarif
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # ──────────────────────────────────────────────
  # Stage: Docker Build
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # No `needs:` so this runs on both PRs and pushes to main without
    # dependency-graph weirdness. PR quality is enforced by branch protection
    # (the quality jobs are required checks at the GitHub repo level).
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and save Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/docker-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  # ──────────────────────────────────────────────
  # Stage: Trivy Container Scan
  # ──────────────────────────────────────────────
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Trivy image scan (table — OS + app)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          output: trivy-report.txt

      - name: Trivy image scan (SARIF — app dependencies only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          output: trivy-results.sarif
          vuln-type: library

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: container-scanning

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy-results.sarif

  # ──────────────────────────────────────────────
  # Stage: Docker Push to DockerHub
  # ──────────────────────────────────────────────
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [docker-build, trivy-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' | grep ${{ env.IMAGE_NAME }} | while read tag; do
            docker push "$tag"
          done
