name: Lint PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
          scopes: |
            app
            api
            auth
            scan
            osv
            epss
            kev
            nvd
            depsdev
            ui
            db
            infra
            pipeline
            chart
            deps
            docs
          requireScope: false
          subjectPattern: '^(?![A-Z]).+$'
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            should start with a lower-case letter.
